# 本地开发容器（与 .devcontainer 同镜像/同约定）
#   启动:  docker compose up -d
#   SSH 进容器:  ssh -p 2222 linuxbrew@127.0.0.1 -i ~/.ssh/macbook_dev
#                (MacBook 端: ssh -p 2222 linuxbrew@192.168.8.145 -i ~/.ssh/id_lan_ubuntu)
#   VS Code: Dev Containers → Attach to Running Container → machine-dev
#            或 Remote-SSH 直连 192.168.8.145:2222 (linuxbrew)
#   停止:  docker compose down
#
#   entrypoint.sh 在 SSH_PORT 存在时前台运行 sshd（保活 + 容器入口），
#   启动时把 /root/authorized_keys 拷入 $HOME/.ssh —— 下面必须挂载公钥。
services:
  dev:
    image: machine-dev:local        # 先执行 ./.devcontainer/build_img.sh 构建
    # build:
    #   context: ./.devcontainer
    container_name: machine-dev
    hostname: machine-dev
    network_mode: host              # sshd 直接监听宿主机 2222
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # entrypoint 使用镜像内置 (Dockerfile: USER root + ENTRYPOINT, SSH_PORT → sshd -D 保活)
    environment:
      SSH_PORT: "2222"
      #HTTP_PROXY: http://host.docker.internal:1080
      #HTTPS_PROXY: http://host.docker.internal:1080
      NO_PROXY: localhost,127.0.0.1,::1,192.168.0.0/16,172.16.0.0/12,100.64.0.0/10
    working_dir: /workspace/
    volumes:
      - ./:/workspace/
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/.ssh/id_ed25519.pub:/root/authorized_keys:ro
      - ./.devcontainer/entrypoint.sh:/entrypoint.sh:ro   # 免重建: 改脚本后 docker compose up -d 即生效(须保持 +x)
    stdin_open: true
    tty: true